<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>അധ്യാപകർ</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#eef2f7;
}

/* Header */
header{
    background:linear-gradient(135deg,#0f766e,#115e59);
    color:white;
    padding:25px;
    text-align:center;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
}

/* Container */
.container{
    padding:20px;
}

/* Grid */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* Card */
.card{
    background:white;
    border-radius:15px;
    padding:15px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px) scale(1.03);
}

/* Image */
.card img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:12px;
}

/* Name */
.card h3{
    margin:10px 0 5px;
}

/* Subject */
.card p{
    color:#555;
    font-size:14px;
}

/* Contact icons */
.icons{
    margin-top:10px;
}

.icons a{
    margin:0 5px;
    text-decoration:none;
    font-size:20px;
}

/* Back button */
.back{
    display:block;
    margin:25px auto;
    width:150px;
    padding:12px;
    text-align:center;
    background:#0f766e;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

/* Mobile */
@media(max-width:600px){
    .grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>
