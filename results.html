<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>തർബിയതുൽ ഉലൂം സെക്കൻഡറി മദ്രസ</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f4f7;
}

/* Header */
header{
  background:#0f766e;
  color:white;
  padding:25px 15px;
  text-align:center;
}

/* Container */
.container{
  padding:20px;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

/* Cards */
.card{
  border-radius:15px;
  padding:25px 10px;
  color:white;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* Hover */
.card:hover{
  transform:scale(1.05);
  transition:0.3s;
}

/* Colors */
.students{ background:#22c55e; }
.results{ background:#3b82f6; }
.gallery{ background:#f59e0b; }
.contact{ background:#06b6d4; }
.teachers{ background:#8b5cf6; }

/* Big Buttons */
.bigbtn{
  display:block;
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.admission{ background:#2563eb; }
.bookshop{ background:#f97316; }

/* WhatsApp Button */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:50%;
  text-decoration:none;
  font-size:18px;
}

/* Footer */
footer{
  margin-top:30px;
  background:#0f766e;
  color:white;
  text-align:center;
  padding:15px;
  font-size:14px;
}
</style>

</head>

</div>

</html>
