<body>

<header style="background:#0f766e;color:white;padding:20px;text-align:center;">
<h2>📊 പരീക്ഷ ഫലം</h2>
<p>Result Status</p>
</header>

<div style="padding:20px;">

<h3>🔍 പേര് search ചെയ്യൂ</h3>

<input type="text" id="name" placeholder="Enter Name" style="width:100%;padding:10px;margin:10px 0;border-radius:8px;">

<h3>🎓 ക്ലാസ് തിരഞ്ഞെടുക്കുക</h3>

<select id="class" style="width:100%;padding:10px;border-radius:8px;">
  <option value="">All</option>
  <option value="1">Class 1</option>
  <option value="2">Class 2</option>
</select>

<button onclick="searchResult()" style="width:100%;padding:12px;margin-top:10px;background:#0f766e;color:white;border:none;border-radius:10px;">
Search
</button>

</div>

<div id="output"></div>

<a href="index.html" style="display:block;margin:20px;text-align:center;background:#0f766e;color:white;padding:10px;border-radius:10px;text-decoration:none;">
⬅ Home
</a>

<script>

let data = [
  {name:"Asees", class:"1", status:"Pass"},
  {name:"Faizan", class:"1", status:"Fail"},
  {name:"Nihal", class:"2", status:"Pass"},
  {name:"Shamil", class:"2", status:"Pass"}
];

function searchResult(){

  let name = document.getElementById("name").value.toLowerCase();
  let cls = document.getElementById("class").value;

  let results = data.filter(s => 
    (name === "" || s.name.toLowerCase().includes(name)) &&
    (cls === "" || s.class === cls)
  );

  let output = "";

  if(results.length > 0){
    results.forEach(r => {

      let color = r.status === "Pass" ? "green" : "red";

      output += `
      <div style="background:white;margin:15px;padding:15px;border-radius:10px;box-shadow:0 5px 10px rgba(0,0,0,0.1);">
        <h3>${r.name}</h3>
        Class: ${r.class}<br>
        Status: <b style="color:${color}">${r.status}</b>
      </div>`;
    });
  } else {
    output = `<div style="margin:20px;">❌ No result found</div>`;
  }

  document.getElementById("output").innerHTML = output;
}

</script>

</body>
