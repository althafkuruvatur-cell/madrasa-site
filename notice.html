<!DOCTYPE html>
<html>
<head>
<title>അറിയിപ്പുകൾ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

/* Header */
.header{
  background:#0f766e;
  color:white;
  padding:20px;
  text-align:center;
}

/* Notice box */
.notice{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.notice:hover{
  transform:scale(1.02);
}

/* Date */
.date{
  font-size:12px;
  color:gray;
}

/* Home button */
.home-btn{
  display:block;
  margin:20px;
  text-align:center;
  background:#0f766e;
  color:white;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
<h2>📢 അറിയിപ്പുകൾ</h2>
</div>

<div class="notice">
<p><b>Admission Started</b></p>
<p class="date">Date: 10-04-2026</p>
</div>

<div class="notice">
<p><b>Annual Exam Result Coming Soon</b></p>
<p class="date">Date: 12-04-2026</p>
</div>

<div class="notice">
<p><b>Class തുടങ്ങുന്നു Monday മുതൽ</b></p>
<p class="date">Date: 15-04-2026</p>
</div>

<a href="index.html" class="home-btn">⬅ Home</a>

</body>
</html>
