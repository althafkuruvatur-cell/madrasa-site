<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board</title>

<style>
body{
  font-family:Arial;
  background:#eef2f7;
  margin:0;
}

/* Header */
.header{
  background:#0f766e;
  color:white;
  padding:15px;
  text-align:center;
}

/* Form */
.form{
  padding:15px;
  background:white;
  margin:15px;
  border-radius:10px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

button{
  background:#0f766e;
  color:white;
  border:none;
}

/* Notice */
.notice{
  background:white;
  margin:15px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.date{
  color:gray;
  font-size:12px;
}

/* Home */
.home{
  display:block;
  margin:20px;
  text-align:center;
  background:#0f766e;
  color:white;
  padding:10px;
  border-radius:10px;
  text-decoration:none;
}
</style>

</head>

<body>

<div class="header">
<h2>📢 Notice Board</h2>
</div>

<!-- ADD NOTICE -->
<div class="form">
<h3>➕ Add Notice</h3>

<input type="text" id="title" placeholder="Title">
<input type="text" id="date" placeholder="Date">
<button onclick="addNotice()">Add</button>

</div>

<!-- DISPLAY -->
<div id="noticeList"></div>

<a href="index.html" class="home">⬅ Home</a>

<script>

// Load notices
let notices = JSON.parse(localStorage.getItem("notices")) || [];

function showNotices(){
  let output="";
  notices.reverse().forEach(n=>{
    output += `
    <div class="notice">
      <b>${n.title}</b>
      <div class="date">${n.date}</div>
    </div>`;
  });
  document.getElementById("noticeList").innerHTML=output;
}

function addNotice(){
  let title=document.getElementById("title").value;
  let date=document.getElementById("date").value;

  if(title=="") return;

  notices.push({title,date});
  localStorage.setItem("notices",JSON.stringify(notices));

  showNotices();
}

showNotices();

</script>

</body>
</html>
