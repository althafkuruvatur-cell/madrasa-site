<title>കമ്മിറ്റി അംഗങ്ങൾ</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7f6;
}

header{
    background:linear-gradient(135deg,#065f46,#0f766e);
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
    padding-bottom:15px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{
    margin:12px 0 5px;
}

.card p{
    color:#444;
    margin:5px 0;
}

.call-btn{
    display:inline-block;
    background:#0f766e;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    text-decoration:none;
    margin-top:10px;
}

.back{
    display:inline-block;
    margin:20px;
    background:#065f46;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    text-decoration:none;
}

@media(max-width:600px){
    .grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>
