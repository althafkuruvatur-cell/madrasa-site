<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f4f7;
}

/* Header */
header{
  background:#0f766e;
  color:white;
  padding:20px;
  text-align:center;
}

/* Navigation */
nav{
  background:#065f46;
  padding:10px;
  text-align:center;

nav a{
  color:white;
  margin:0 10px;
  text-decoration:none;
  font-size:14px;
}

/* Container */
.container{
  padding:20px;
}

/* Grid layout */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

/* Card */
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* Images */
.card img{
  width:80px;
  height:80px;
  border-radius:50%;
}

/* Buttons */
.button{
  display:block;
  margin-top:10px;
  padding:10px;
  background:#3b82f6;
  color:white;
  border-radius:10px;
  text-decoration:none;
}

/* Footer */
footer{
  margin-top:20px;
  background:#0f766e;
  color:white;
  text-align:center;
  padding:15px;
}

/* 📱 Responsive */
@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>

</head>
