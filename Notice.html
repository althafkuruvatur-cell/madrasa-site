<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#eef2f7;
}

/* Header */
header{
  background:#0f766e;
  color:white;
  padding:20px;
  text-align:center;
}

/* Notice box */
.notice-container{
  padding:20px;
}

.notice{
  background:white;
  border-left:5px solid #0f766e;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* Title */
.notice h3{
  margin:0;
  color:#0f766e;
}

/* Date */
.notice small{
  color:gray;
}

/* Back button */
.back{
  display:block;
  margin:20px;
  padding:12px;
  text-align:center;
  background:#0f766e;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

</style>

</head>

<body>

<header>
  <h2>📢 Notice Board</h2>
</header>

<div class="notice-container">

  <div class="notice">
    <h3>Annual Exam Notice</h3>
    <small>10 March 2026</small>
    <p>Annual exam will start from April 1.</p>
  </div>

  <div class="notice">
    <h3>Holiday Announcement</h3>
    <small>5 March 2026</small>
    <p>Madrasa will be closed on Friday.</p>
  </div>

  <div class="notice">
    <h3>Parent Meeting</h3>
    <small>1 March 2026</small>
    <p>Meeting at 10 AM in Madrasa hall.</p>
  </div>

</div>

<a href="index.html" class="back">⬅ Home ലേക്ക് പോവുക</a>

</body>
</html>
